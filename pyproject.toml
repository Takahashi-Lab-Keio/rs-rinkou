[project]
name = "rs-rinkou"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.7.5",
    "mmcv==2.1.0",
    "mmdet==3.2.0",
    "mmpose==1.3.2",
    "numpy>=1.26,<2",
    "pyrealsense2>=2.55.1.6486",
    "scipy>=1.17.1",
    "torch==2.1.0",
    "torchvision==0.16.0",
]

[project.scripts]
rs-rinkou = "rs_rinkou:main"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
mmcv = { url = "https://download.openmmlab.com/mmcv/dist/cu121/torch2.1.0/mmcv-2.1.0-cp311-cp311-manylinux1_x86_64.whl" }

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
